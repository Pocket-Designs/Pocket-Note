name: Build Pocket-Note installers
on:
  workflow_dispatch: {}
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: Pocket-Note-Windows
          path: |
            dist/*.exe
            dist/*.msi
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.exe
            dist/*.msi
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm install
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v7
        with:
          name: Pocket-Note-Linux
          path: |
            dist/*.AppImage
            dist/*.deb
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
