name: Build Pocket-Note installers
# Installers are attached straight to a GitHub Release. No Actions artifacts
# are created, so the Actions storage quota is never used.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish to (e.g. v1.0.2)'
        required: true
        default: 'v1.0.0'
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm install
      - run: npm run dist:win
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: |
            dist/*.exe
            dist/*.msi
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm install
      - run: npm run dist:linux
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: |
            dist/*.AppImage
            dist/*.deb
