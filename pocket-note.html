body{font:13.5px/1.5 "Inter","Segoe UI",system-ui,-apple-system,sans-serif}
button,.btn{border-radius:5px;padding:3px 7px;background:transparent;border:1px solid transparent;box-shadow:none!important;transform:none!important}

.tab{border:0;border-right:1px solid var(--b);border-radius:0;padding:5px 12px;font-size:12.5px;max-width:200px;box-shadow:none}

const MIME_RE=/data:([\w.+-]+\/[\w.+-]+);base64,([A-Za-z0-9+\/=]+)/g,REF_RE=/pnm:([a-z0-9]+~[\w.+-]+)/g;
function packStr(js,M){return js.replace(MIME_RE,(m,mt,b)=>{if(b.length<1500)return m;const nm=cyrb(b)+cyrb(b,7)+'~'+mt.replace('/','_');M.set(nm,b);MEDIA.set(nm,b);return 'pnm:'+nm})}
const unpackStr=js=>js.replace(REF_RE,(m,nm)=>{const b=MEDIA.get(nm);return b?'data:'+nm.split('~')[1].replace('_','/')+';base64,'+b:m});
const idb=()=>new Promise((res,rej)=>{const q=indexedDB.open('pn-sync',1);q.onupgradeneeded=()=>q.result.createObjectStore('h');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const idbSet=async(k,v)=>{const d=await idb();return new Promise((r,j)=>{const t=d.transaction('h','readwrite');t.objectStore('h').put(v,k);t.oncomplete=r;t.onerror=()=>j(t.error)})};
const idbGet=async k=>{const d=await idb();return new Promise((r,j)=>{const q=d.transaction('h').objectStore('h').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})};
/* folder back-ends: browser (File System Access API) and desktop app (Node fs) */
const fsaDir=root=>{const nav=async(p,mk)=>{const a=p.split('/'),f=a.pop();let d=root;for(const x of a)d=await d.getDirectoryHandle(x,{create:mk});return[d,f]};
 return{name:root.name,
  async ls(p){const o=[];try{const[d]=await nav(p+'/x',false);for await(const[n,h]of d.entries())if(h.kind=='file')o.push(n)}catch(e){}return o},
  async rd(p){try{const[d,f]=await nav(p,false);return new Uint8Array(await(await(await d.getFileHandle(f)).getFile()).arrayBuffer())}catch(e){return null}},
  async wr(p,b){const[d,f]=await nav(p,true),w=await(await d.getFileHandle(f,{create:true})).createWritable();await w.write(b);await w.close()},
  async rm(p){try{const[d,f]=await nav(p,false);await d.removeEntry(f)}catch(e){}}}};
const natDir=p=>({name:p,ls:s=>NAT.ls(p,s),rd:s=>NAT.rd(p,s),wr:(s,b)=>NAT.wr(p,s,b),rm:s=>NAT.rm(p,s)});
async function dirOpen(manual){const sy=S.sync;if(sy.path&&NAT)return natDir(sy.path);if(sy.path)throw new Error('This folder was set up in the desktop app');
 const h=await idbGet('dir');if(!h)throw new Error('Folder not found – reconnect it in Settings');let p=await h.queryPermission({mode:'readwrite'});
 if(p!='granted'){if(!manual)throw new Error('Click ☁ to allow folder access');p=await h.requestPermission({mode:'readwrite'});if(p!='granted')throw new Error('Folder access was denied')}return fsaDir(h)}
/* optional encryption of everything in the folder */
const deriveRaw=async(pw,salt)=>{const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},m,256))};
const ckSet=async raw=>{CK=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt'])};
const ckLoad=async()=>{CK=null;if(S.sync&&S.sync.k)await ckSet(unb(S.sync.k))};
const enc=async b=>{if(!CK)return b;const iv=crypto.getRandomValues(new Uint8Array(12)),c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},CK,b)),o=new Uint8Array(12+c.length);o.set(iv);o.set(c,12);return o};
const dec=async b=>CK?new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},CK,b.slice(12))):b;
/* the sync itself: read remote -> decide (no awaits) -> write */
async function syncRun(D){const sy=S.sync,base=sy.base||(sy.base={});await ckLoad();
 let info=null;{const b=await D.rd('sync.json');if(b)try{info=JSON.parse(new TextDecoder().decode(b))}catch(e){}}
 if(!info)throw new Error('sync.json is missing – reconnect the folder');if(info.enc&&!CK)throw new Error('Sync password needed – reconnect the folder');
 const rj=async p=>{const b=await D.rd(p);if(!b)return null;try{return JSON.parse(new TextDecoder().decode(await dec(b)))}catch(e){return{bad:1}}};
 const R={};let bad=0;const names=(await D.ls('nodes')).filter(n=>n.endsWith('.json'));
 for(let i=0;i<names.length;i+=8)await Promise.all(names.slice(i,i+8).map(async n=>{const r=await rj('nodes/'+n);if(r&&r.id&&r.u)R[r.id]=r;else bad++}));
 const rm=await rj('meta.json'),have=new Set(await D.ls('media')),need=new Set();
 for(const id in R){const r=R[id],b=base[id];if(r.d&&(!b||r.u!==b.ru))(JSON.stringify(r.d).match(REF_RE)||[]).forEach(x=>{const nm=x.slice(4);if(!MEDIA.has(nm))need.add(nm)})}
 for(const nm of need){const bt=await D.rd('media/'+nm);if(bt)MEDIA.set(nm,b64(await dec(bt)))}
 /* ---- decide (synchronous = consistent snapshot) ---- */
 edFlush();const now=Date.now(),W=[],MW=new Map(),ch={ui:false,n:0,miss:0},lm=new Map(S.nodes.map(n=>[n.id,n])),dev=sy.dev;
 const meta=()=>({nbs:S.nbs,plugins:S.plugins,dict:S.dict||[],sp:S.sp});
 let metaW=false;{const bm=base.meta,lh=cyrb(stab(meta())),lch=!bm||bm.h!==lh,rch=rm&&!rm.bad&&rm.d&&(!bm||rm.u!==bm.ru);
  if(rch){const d=rm.d;if(lch){d.nbs.forEach(x=>{if(!S.nbs.find(y=>y.id==x.id))S.nbs.push(x)});(d.plugins||[]).forEach(p=>{if(!S.plugins.find(y=>y.name==p.name))S.plugins.push(p)});S.dict=[...new Set([...(S.dict||[]),...(d.dict||[])])];metaW=true}
   else{S.nbs=d.nbs;S.plugins=d.plugins||[];S.dict=d.dict||[];if(d.sp)S.sp=d.sp;base.meta={h:cyrb(stab(meta())),ru:rm.u};ch.ui=true}}
  else if(lch)metaW=true}
 const apply=(id,r)=>{const js=unpackStr(JSON.stringify(r.d));if(/pnm:[a-z0-9]+~/.test(js)){ch.miss++;return null}const o=JSON.parse(js),old=lm.get(id);if(!o.enc)migrate(o);if(old){o.col=old.col;o.z=old.z;S.nodes[S.nodes.indexOf(old)]=o}else S.nodes.push(o);lm.set(id,o);base[id]={h:hashN(o),u:r.u,ru:r.u};ch.ui=true;ch.n++;return o};
 const wnode=(l,h)=>{const b=base[l.id],u=Math.max(now,(b&&b.u||0)+1),M=new Map(),ps=packStr(JSON.stringify(coreN(l)),M);M.forEach((v,k)=>MW.set(k,v));
  W.push({p:'nodes/'+l.id+'.json',s:`{"id":${JSON.stringify(l.id)},"u":${u},"dev":${JSON.stringify(dev)},"d":${ps}}`,post:()=>{base[l.id]={h,u,ru:u}}})};
 const wdel=id=>{const b=base[id],u=Math.max(now,(b&&b.u||0)+1);W.push({p:'nodes/'+id+'.json',s:`{"id":${JSON.stringify(id)},"u":${u},"dev":${JSON.stringify(dev)},"del":true}`,post:()=>{base[id]={del:true,h:null,u,ru:u}}})};
 const extra=[];
 for(const id of new Set([...lm.keys(),...Object.keys(R),...Object.keys(base).filter(k=>k!='meta')])){
  const l=lm.get(id),r=R[id],b=base[id],lh=l?hashN(l):null,
   lch=l?(!b||b.del||b.h!==lh):(!!b&&!b.del),rch=!!r&&(!b||r.u!==b.ru);
  if(l&&!r){wnode(l,lh);continue}
  if(!l&&!r){delete base[id];continue}
  if(!l){if(r.del){base[id]={del:true,h:null,u:r.u,ru:r.u};continue}if(b&&!b.del&&!rch){wdel(id);continue}apply(id,r);continue}
  if(r.del){if(lch&&b&&!b.del){wnode(l,lh)}else if(lch&&!b){wnode(l,lh)}else{S.nodes=S.nodes.filter(x=>x!==l);lm.delete(id);base[id]={del:true,h:null,u:r.u,ru:r.u};ch.ui=true;ch.n++}continue}
  if(!lch&&!rch)continue;if(lch&&!rch){wnode(l,lh);continue}
  if(!lch&&rch){apply(id,r);continue}
  const js=unpackStr(JSON.stringify(r.d));if(/pnm:[a-z0-9]+~/.test(js)){ch.miss++;continue}
  let ro;try{ro=JSON.parse(js)}catch(e){continue}
  if(hashN(ro)===lh){base[id]={h:lh,u:r.u,ru:r.u};continue}
  const cp=JSON.parse(JSON.stringify(coreN(l)));cp.id=uid();cp.t=(l.t||'Untitled')+' (conflicted copy)';extra.push(cp);apply(id,r)}
 extra.forEach(cp=>{S.nodes.push(cp);lm.set(cp.id,cp);wnode(cp,hashN(cp));ch.ui=true});
 const ids=new Set(S.nodes.map(n=>n.id));S.nodes.forEach(n=>{if(n.p&&!ids.has(n.p)){n.p=null;ch.ui=true}});
 S.nbs.forEach(x=>{});[...new Set(S.nodes.map(n=>n.nb))].forEach(i=>{if(!S.nbs.find(x=>x.id==i)){S.nbs.push({id:i,name:'Recovered notebook',icon:'📓'});ch.ui=true}});
 if(!S.nbs.find(x=>x.id==S.cur))S.cur=S.nbs[0].id;if(S.sel&&!ids.has(S.sel))S.sel=null;
 /* ---- write ---- */
 for(const[nm,v]of MW){if(have.has(nm))continue;await D.wr('media/'+nm,await enc(unb(v)));have.add(nm)}
 for(const w of W){await D.wr(w.p,await enc(new TextEncoder().encode(w.s)));w.post()}
 if(metaW){const u=Math.max(now,(base.meta&&base.meta.ru||0)+1);await D.wr('meta.json',await enc(new TextEncoder().encode(JSON.stringify({u,dev,d:meta()}))));base.meta={h:cyrb(stab(meta())),ru:u}}
 sy.last=Date.now();sy.err=bad||ch.miss?`${bad+ch.miss} item(s) could not be read yet – will retry`:null;return ch}
async function syncNow(manual){if(SYNCING)return;const sy=S.sync;if(!sy||!(sy.path||sy.h))return manual?syncClick():0;if(!manual&&sy.auto===false)return;
 SYNCING=true;syncUi();let ch=null;try{ch=await syncRun(await dirOpen(manual))}catch(e){sy.err=e&&e.message||String(e);console.warn('sync',e)}
 if(ch&&ch.ui){if(!S.sel)S.sel=tabsFor().slice(-1)[0]||null;render()}else save();SYNCING=false;syncUi()}
const syncStatus=()=>{const sy=S.sync;return SYNCING?'Syncing…':!sy?'Sync is off':sy.err?'⚠ '+sy.err:sy.last?'Synced '+new Date(sy.last).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'Not synced yet'};
function syncUi(){const b=$('#syb');if(!b)return;const sy=S.sync;b.textContent=SYNCING?'⟳':sy&&sy.err?'⚠':'☁';b.title='Sync – '+syncStatus();b.classList.toggle('syn',SYNCING)}
function syncClick(){if(S.sync&&(S.sync.path||S.sync.h))syncNow(true);else settings()}
function syncSoon(){const sy=S.sync;if(!sy||sy.auto===false||!(sy.path||sy.h)||SYNCING)return;clearTimeout(SYNCT);SYNCT=setTimeout(()=>syncNow(false),8000)}
async function syncConnect(){document.querySelectorAll('.st').forEach(x=>x.remove());let h=null,path=null,name;
 try{if(NAT){path=await NAT.pick();if(!path)return;name=path}else{if(!window.showDirectoryPicker)return toast('This browser can’t choose a folder – use Chrome/Edge or the desktop app');h=await showDirectoryPicker({mode:'readwrite'});name=h.name}}catch(e){return}
 const D=NAT?natDir(path):fsaDir(h);let info=null,k=null;{const b=await D.rd('sync.json');if(b)try{info=JSON.parse(new TextDecoder().decode(b))}catch(e){}}
 if(info&&info.enc){const pw=await dlg('This folder is encrypted. Enter its sync password',{pw:1});if(pw===null)return;try{const raw=await deriveRaw(pw,unb(info.salt));await ckSet(raw);await dec(unb(info.check));k=b64(raw)}catch(e){CK=null;return toast('Wrong sync password')}}
 else if(!info){const pw=await dlg('Optional: set a sync password to encrypt everything in this folder (leave blank for no encryption)',{pw:1});if(pw===null)return;
  if(pw){const salt=crypto.getRandomValues(new Uint8Array(16)),raw=await deriveRaw(pw,salt);await ckSet(raw);info={v:1,enc:true,salt:b64(salt),check:b64(await enc(new TextEncoder().encode('pocketnote')))};k=b64(raw)}else info={v:1,enc:false};
  await D.wr('sync.json',new TextEncoder().encode(JSON.stringify(info)))}
 S.sync={dev:(S.sync&&S.sync.dev)||uid(),path,name,k,base:{},auto:true};if(h)await idbSet('dir',h);await ckLoad();save();renderSB();toast('Folder connected');syncNow(true)}
function syncDisconnect(){S.sync=null;document.querySelectorAll('.st').forEach(x=>x.remove());save();renderSB();toast('Sync disconnected (the folder was left as it is)')}
function syncSettingsHtml(){const sy=S.sync,on=sy&&(sy.path||sy.h);return '<b>Sync between devices</b>'+(on?`<div>📁 ${esc(sy.name||'')}${sy.k?' 🔒':''}</div><small style="color:var(--m)">${esc(syncStatus())}</small><label class=ck><input type=checkbox ${sy.auto!==false?'checked':''} onchange="S.sync.auto=this.checked;save()"> Sync automatically</label><button onclick="this.closest('.st').remove();syncNow(true)">⟳ Sync now</button><button onclick="syncDisconnect()">Disconnect</button>`:`<small style="color:var(--m)">Choose a folder that Syncthing, OneDrive, Dropbox, Nextcloud… keeps in step between your devices. Pocket-Note saves your notes in it as small files, optionally encrypted with a sync password.</small><button onclick="syncConnect()">📁 Choose sync folder…</button>`)}
function syncBoot(){if(S.sync&&(S.sync.path||S.sync.h)){ckLoad().catch(()=>{});setTimeout(()=>syncNow(false),1500)}setInterval(()=>{if(!document.hidden)syncNow(false)},45000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(()=>syncNow(false),500)})}

/* ---------- export ---------- */
const tmd=t=>t.rows.map((r,i)=>'| '+r.map(c=>(c.t||' ').replace(/\n/g,'<br>')).join(' | ')+' |'+(i?'':'\n|'+r.map(()=>' --- |').join(''))).join('\n');
function nmd(n,d=1){if(n.enc)return '';let o='#'.repeat(Math.min(d,6))+' '+n.t+'\n\n'+(n.ty=='c'?cvMd(n):mdx(n))+'\n\n';if(n.files.length)o+=n.files.map(f=>'- 📎 '+f.name).join('\n')+'\n\n';kids(n.nb,n.id).forEach(k=>o+=nmd(k,d+1));return o}
function dl(name,txt){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/markdown'}));a.download=name+'.md';a.click()}
function pn(n,d){if(n.enc)return '';return `<h${Math.min(d,4)}>${esc(n.t)}</h${Math.min(d,4)}>`+pbody(n)+kids(n.nb,n.id).map(k=>pn(k,d+1)).join('')}
function pdf(ns){edFlush();$('#pr').innerHTML=ns.map(n=>pn(n,1)).join('');setTimeout(()=>{print();$('#pr').innerHTML=''},150)}
S.open=S.open||[];if(S.sel&&!S.open.includes(S.sel))S.open.push(S.sel);
spInit();migrateAll();document.documentElement.dataset.theme=S.theme;render();spRefresh();syncBoot();
</script></body></html>
